<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // ".../hatab" has to become ".../hatab/", or the relative links to the app's files break.
      if (!/\/$|\.[a-z0-9]+$/i.test(location.pathname)) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0277bd" />
    <meta name="description" content="دفتر حسابات العملاء: مين عليه ومين له، وتذكير على واتساب. بيشتغل على الموبايل من غير نت." />
    <meta name="apple-mobile-web-app-title" content="HATAB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>HATAB · دفتر الحسابات</title>
  </head>
  <body>
    <noscript>لازم تشغّل JavaScript في المتصفح عشان البرنامج يشتغل.</noscript>
    <div id="root"></div>
    <script>
      // Plain old JavaScript on purpose: it has to run even where the app itself can't
      // (an old browser, a file that failed to download...), so the page never stays blank.
      (function () {
        var shown = false;
        function show(reason) {
          var root = document.getElementById('root');
          if (shown || !root || root.hasChildNodes()) return;
          shown = true;
          var box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.style.cssText =
            'max-width:480px;margin:12vh auto 0;padding:24px 20px;text-align:center;line-height:1.7;' +
            'font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#1c2228';
          box.innerHTML =
            '<h1 style="font-size:22px;margin:0 0 8px">البرنامج مش قادر يفتح على المتصفح ده</h1>' +
            '<p style="margin:0 0 16px">جرّب تحدّث الصفحة. لو المشكلة فضلت، افتحه من آخر إصدار من Chrome أو Safari، وابعت صورة من الشاشة دي.</p>' +
            '<button type="button" style="font:inherit;font-weight:700;padding:10px 22px;border:0;border-radius:12px;background:#0277bd;color:#fff">حدّث الصفحة</button>' +
            '<pre dir="ltr" style="margin:20px 0 0;padding:12px;background:#f3f5f7;border-radius:8px;font-size:12px;text-align:left;white-space:pre-wrap;word-break:break-word"></pre>';
          box.querySelector('button').onclick = function () {
            window.location.reload();
          };
          box.querySelector('pre').textContent = reason + '\n' + navigator.userAgent;
          root.appendChild(box);
        }
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target !== window && (target.src || target.href)) {
              show('Could not load ' + (target.src || target.href));
            } else {
              show(String(event.message || event.error || 'Script error'));
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          show(String(event.reason));
        });
        setTimeout(function () {
          show('The app did not start within 15 seconds.');
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
